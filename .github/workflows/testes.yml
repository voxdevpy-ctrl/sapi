name: Testes

on:
  push:
    branches: [main]
  pull_request:

# privilégio mínimo: só leitura do código; nenhum segredo é usado
permissions:
  contents: read

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - name: FFmpeg
        run: choco install ffmpeg -y --no-progress
      - name: Dependências
        run: python -m pip install -r requirements.txt
      - name: Testes
        env:
          PYTHONIOENCODING: utf-8
        run: python -m unittest tests.test_ajustes tests.test_armazenamento tests.test_cota tests.test_decisoes tests.test_pagina tests.test_postagem tests.test_producao tests.test_recomendacao tests.test_remoto tests.test_revisao tests.test_ritmo tests.test_traducao

  segredos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks (versão fixa, conferida pela soma oficial)
        run: |
          curl -sSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -sSLo sums.txt https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          grep "gitleaks_8.30.1_linux_x64.tar.gz" sums.txt | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          ./gitleaks git . --redact --no-banner
